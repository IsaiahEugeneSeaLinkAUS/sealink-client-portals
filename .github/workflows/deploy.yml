name: Build and deploy client schedule sites

on:
  repository_dispatch:
    types: [rebuild-request] # matches the Event Name set in Power Automate's "Create a repository dispatch event" action
  schedule:
    # Safety-net only - Power Automate's GitHub connector now drives the
    # real cadence via repository_dispatch above; this hourly run just
    # guarantees a rebuild happens even if that call ever fails.
    - cron: '0 * * * *'
  workflow_dispatch: {} # lets you trigger a rebuild manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug - list repo root
        run: ls -la

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build client sites
        env:
          HELM_CSV_URL: ${{ secrets.HELM_CSV_URL }}
          HELM_API_KEY: ${{ secrets.HELM_API_KEY }}
          ONWATCH_API_KEY: ${{ secrets.ONWATCH_API_KEY }}
          ONWATCH_FLEET_ID: ${{ secrets.ONWATCH_FLEET_ID }}
        run: node build.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
