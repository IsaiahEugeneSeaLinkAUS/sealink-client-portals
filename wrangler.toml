name = "sealink-gladstone-client"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Deliberately NOT bound: DRILLS_KV, CERTS_KV, PM_KV, WORK_KV, FORMS_KV,
# CREW_KV, TASKS_KV. This Worker cannot read an internal register. Do not add
# one of those bindings here to save a fetch; that is the whole control.
[[kv_namespaces]]
binding = "CLIENT_KV"
id = "bfe5da5ff6474e9f9e64605d63c8ab95"

[[d1_databases]]
binding = "DB"
database_name = "sealink-client-auth"
database_id = "5ee58624-66e5-4066-be4c-c748085a899e"

# Kept here rather than only in the dashboard, because this Worker deploys from
# Git and the dashboard toggles can be reset by a deployment. Logs are what turn
# an Error 1101 into a readable exception.
# Lets src/logo.png import as an ArrayBuffer instead of being read at runtime.
# Same rule as the crew Worker.
[[rules]]
type = "Data"
globs = ["**/*.png"]

[observability.logs]
enabled = true
invocation_logs = true
persist = true

[triggers]
crons = ["0 */2 * * *"]

[vars]
HELM_CSV_URL = "https://prod.sealink.helmconnect.com/api/v1/jobs/reports/tables/csvlink?configId={configId}&timezone=Australia%2FBrisbane"
HELM_TRIPLOG_CONFIG_ID = "019fa6aa-4267-7053-b6d4-2efb7ccbc1af"
HELM_DISPATCH_CONFIG_ID = "019fa6b4-a0d0-7709-8bbd-b4dc8d3dc75b"

# Secrets, set with `wrangler secret put` — never in this file:
#   HELM_API_KEY     Helm Connect Api-Key header value
#   SESSION_SECRET   random 32+ bytes, HMAC key for session cookies
#   AUTH_PEPPER      random 32+ bytes, server-side password pepper
#   SETUP_TOKEN      random string, used once at /setup to create the first
#                    administrator. /setup closes permanently after that.

[[routes]]
pattern = "client.sealinkgladstone.com/*"
zone_name = "sealinkgladstone.com"
